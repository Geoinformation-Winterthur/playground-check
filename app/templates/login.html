{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="mat-card" style="width: 100%; max-width: 400px; padding: 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2 style="color: var(--primary-color); font-weight: 600;">Anmelden</h2>
            <p style="color: var(--text-secondary);">Bitte melden Sie sich an, um fortzufahren.</p>
        </div>

        <form action="" method="post" class="signin-form">
            <div class="mat-form-field">
                <input type="text" name="loginname" class="mat-input" placeholder="E-Mail Adresse" required autofocus>
            </div>
            <div class="mat-form-field">
                <input type="password" name="password" class="mat-input" placeholder="Passwort" required>
            </div>

            {% if error %}
            <div class="error_message"
                style="color: #d32f2f; margin-bottom: 16px; font-size: 0.9rem; text-align: center;">
                {{ error }}
            </div>
            {% endif %}

            <button type="submit" class="login_button" style="width: 100%; padding: 12px; font-size: 1rem;">
                Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
