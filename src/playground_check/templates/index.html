<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>{{APP_TITLE}}</title>
  <meta name="description" content="WebApp der Stadtverwaltung Winterthur zur Unterstützung der Kontrolle von Spielplätzen.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff1900">
  <link rel="icon" href="/static/assets/favicon.ico">
  <link rel="apple-touch-icon" href="/static/assets/icons/icon-192x192.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="app-shell">
    <header class="toolbar">
      <button id="menu-button" class="icon-button material-icons" aria-label="Menü öffnen">menu</button>
      <span id="app-title" class="logo-title" data-short-title="{{APP_SHORT_TITLE}}">{{APP_TITLE}}</span><span class="logo-subtitle">Winterthur</span>
      <span class="toolbar-spacer"></span>
      <img class="main-logo" src="/static/assets/win_logo.svg" alt="Logo Stadt Winterthur">
      <button id="login-button" class="toolbar-login"><span class="material-icons">login</span><span>Login</span></button>
      <button id="user-chip" class="user-chip hidden" aria-label="Benutzermenü">AN</button>
      <div id="user-menu" class="user-menu hidden">
        <label>Sprache<select><option>Deutsch</option></select></label>
        <button id="logout-button"><span class="material-icons">logout</span> Logout</button>
      </div>
    </header>
    <div class="layout">
      <aside id="sidenav" class="sidenav">
        <nav>
          <a href="/" data-route><span class="material-icons">speaker_notes</span>Willkommen</a>
          <div id="private-nav" class="hidden">
            <a href="/choosedevice" data-route><span class="material-icons">sports_soccer</span>Spielgeräte</a>
            <a href="/inspections" data-route><span class="material-icons">description</span>Inspektion</a>
            <a href="/defects" data-route><span class="material-icons">build_circle</span>Mängel</a>
            <a id="users-nav" class="hidden" href="/users" data-route><span class="material-icons">person</span>Benutzer</a>
          </div>
          <a href="https://stadt.winterthur.ch/impressum"><span class="material-icons">star_border</span>Impressum</a>
        </nav>
      </aside>
      <main id="content" tabindex="-1"></main>
    </div>
  </div>
  <div id="snackbar" role="status" class="snackbar hidden"></div>
  <noscript>Bitte aktivieren Sie JavaScript um diese Applikation nutzen zu können.</noscript>
  <script>window.APP_VERSION="{{APP_VERSION}}";window.APP_CONFIG={{APP_CONFIG}};window.SERVICE_WORKER_ENABLED={{SERVICE_WORKER_ENABLED}};</script>
  <script src="/static/js/app.js"></script>
</body>
</html>
